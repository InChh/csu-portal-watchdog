[package]
name = "csu-portal-watchdog"
version = "0.2.0"
edition = "2021"
default-run = "csu-portal-watchdog"

[dependencies]
base64 = "0.22"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
encoding_rs = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "native-tls", "gzip", "cookies"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[profile.release]
strip = true
lto = "thin"
